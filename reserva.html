<!DOCTYPE html>  
<html lang="es">  
<head>  
  <meta charset="UTF-8" />  
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />  
  <title>Reserva - Uñas y Manicura Glamour</title>  
  <link rel="stylesheet" href="styles.css" />  
</head>  
<body>  
  <header>  
    <h1>Uñas y Manicura Glamour</h1>  
    <nav>  
      <a href="index.html">Inicio</a>  
      <a href="servicios.html">Servicios</a>  
      <a href="galeria.html">Galería</a>  
      <a href="reserva.html">Reserva</a>  
      <a href="contacto.html">Contacto</a>  
    </nav>  
  </header>  
  <section id="reserva">  
    <h2>Haz tu reserva</h2>  
    <form>  
      <label for="nombre">Nombre completo</label>  
      <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required />  

      <label for="email">Email</label>  
      <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required />  

      <label for="telefono">Teléfono</label>  
      <input type="tel" id="telefono" name="telefono" placeholder="+34 600 123 456" required />  

      <label for="servicio">Servicio que deseas</label>  
      <select id="servicio" name="servicio" required>  
        <option value="">Selecciona un servicio</option>  
        <option value="manicura_basica">Manicura Básica</option>  
        <option value="uñas_gel">Uñas de Gel</option>  
        <option value="nail_art">Decoraciones y Nail Art</option>  
      </select>  

      <label for="fecha">Fecha y hora</label>  
      <input type="datetime-local" id="fecha" name="fecha" required />  

      <button type="submit">Enviar Reserva</button>  
    </form>  
  </section>  
  <footer>  
    <p>&copy; 2025 Uñas y Manicura Glamour</p>  
  </footer>  
</body>  
</html>
